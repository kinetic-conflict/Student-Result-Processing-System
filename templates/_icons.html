{# Inline SVG icons (Lucide, ISC licence) from templates/icons/. Inline keeps them inside the content security policy. #}
{% macro icon(name, size=18) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">{% include "icons/" ~ name ~ ".svg" %}</svg>
{%- endmacro %}
