{% extends "base.html" %}
{% block title %}{{ title }} - Student Result Processing System{% endblock %}
{% block content %}
<div class="text-center py-5">
    <p class="display-4 text-muted mb-0">{{ status }}</p>
    <h1 class="h3">{{ title }}</h1>
    <p class="lead">{{ message }}</p>
    {% if current_user %}
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to my home page</a>
    {% else %}
    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Go to sign in</a>
    {% endif %}
</div>
{% endblock %}
